<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>賭螺預測 · 全部紀錄</title>
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="賭螺預測" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body class="page-records" data-page="records">
  <div class="bg-glow"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">🐚</span>
      <div>
        <h1 data-i18n="header.recordsTitle">全部紀錄</h1>
        <p><span data-i18n="header.recordsIntroPrefix">檢視已載入的</span> <strong id="dataCount">0</strong> <span data-i18n="header.recordsIntroSuffix">筆對局。改儲存格會立即儲存，也可新增或刪除。變更存在此瀏覽器，並在下載 Excel 時寫入。</span></p>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html" data-i18n="nav.predict">預測</a>
      <a href="records.html" class="on" data-i18n="nav.records">全部紀錄</a>
      <a href="settings.html" data-i18n="nav.settings">名稱設定</a>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label">
        <button class="lang-btn" type="button" data-lang="zh-Hant" aria-pressed="true">繁</button>
        <button class="lang-btn" type="button" data-lang="zh-Hans" aria-pressed="false">简</button>
        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </header>

  <main>
    <section id="dataPanel" class="panel data-panel">
      <div class="data-tools">
        <button id="addRowBtn" class="primary-btn tiny" type="button" data-i18n="records.addRow">新增一列</button>
        <label class="ghost-btn file-label"><span data-i18n="records.openExcel">開啟 Excel</span><input id="excelFile" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden /></label>
        <button id="saveExcelBtn" class="ghost-btn" type="button" data-i18n="records.download">下載 Excel</button>
        <span id="unsavedPill" class="pill unsaved-pill hidden" data-unsaved><span data-unsaved-text>尚有 0 筆未寫入 Excel</span></span>
        <label class="check-label"><input id="clearExtrasOnOpen" type="checkbox" /> <span data-i18n="records.clearExtras">開啟時清除瀏覽器新增</span></label>
        <input id="dataFilter" class="data-filter" type="search" data-i18n-placeholder="records.search" placeholder="搜尋螺、心情或贏家" />
        <span id="fileName" class="pill">尚未載入</span>
        <span class="pill"><span data-i18n="records.showing">顯示</span> <span id="dataShown">0</span></span>
      </div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="records.colIndex">#</th>
              <th data-conch-head="卡爾">卡爾</th>
              <th data-conch-head="逮蝦">逮蝦</th>
              <th data-conch-head="螺神">螺神</th>
              <th data-conch-head="螺寶">螺寶</th>
              <th data-conch-head="啵塞咚">啵塞咚</th>
              <th data-conch-head="礦工">礦工</th>
              <th data-conch-head="爆螺">爆螺</th>
              <th data-conch-head="拖拉機">拖拉機</th>
              <th data-conch-head="船長">船長</th>
              <th data-i18n="records.colWinner">赢的螺</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
      <p id="dataEmpty" class="data-empty hidden">沒有符合的紀錄。</p>
      <span id="dataHint" class="hint"></span>
    </section>
  </main>

  <footer>
    <p><span data-i18n="footer.source">資料來源：</span><span id="footSource">尚未載入 Excel</span><span data-i18n="footer.totalPrefix"> · 共 </span><span id="footCount">0</span><span data-i18n="footer.totalSuffix"> 筆歷史對局</span></p>
  </footer>

  <script src="vendor/xlsx/xlsx.full.min.js"></script>
  <script src="i18n.js?v=13"></script>
  <script src="app.js?v=13"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
